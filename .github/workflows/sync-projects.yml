name: Sync projects

# Atualiza src/data/github-projects.json e public/projects/ a partir dos
# repositórios fixados no perfil (gravados em scripts/github-projects/pinned.json) e abre um PR
# quando algo muda. Agendamentos só rodam na branch padrão do repositório.
on:
  schedule:
    - cron: '17 6 * * 1' # segundas, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run sync:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run format:check
      - uses: peter-evans/create-pull-request@v7
        with:
          # PRs abertos com o GITHUB_TOKEN padrão não disparam o CI. Para que o
          # CI rode no PR, crie o secret SYNC_PROJECTS_TOKEN_MYPORTFOLIO (PAT com acesso a
          # contents e pull requests deste repositório).
          token: ${{ secrets.SYNC_PROJECTS_TOKEN_MYPORTFOLIO || secrets.GITHUB_TOKEN }}
          branch: chore/sync-projects
          delete-branch: true
          add-paths: |
            scripts/github-projects/pinned.json
            src/data/github-projects.json
            public/projects
          commit-message: 'chore: sync github projects'
          title: 'chore: sync github projects'
          body: |
            Atualização automática dos projetos pessoais, gerada por
            `npm run sync:projects` a partir de `scripts/github-projects/pinned.json`.

            Revise o diff de `src/data/github-projects.json` e das imagens em
            `public/projects/` antes de integrar.
